name: Publish Package

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to recover after a verified interrupted publish (for example 0.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.title == 'chore: version packages')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the version pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify the approved publishing trigger and package version
        env:
          RECOVERY_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          node <<'NODE'
          const fs = require('node:fs')
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`package version ${version} is not a semantic version`)
          }
          if (process.env.RECOVERY_VERSION && process.env.RECOVERY_VERSION !== version) {
            throw new Error(`recovery version ${process.env.RECOVERY_VERSION} does not match package version ${version}`)
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Detect an already published version
        id: npm-version
        run: |
          set -eu
          PACKAGE_NAME="$(node -p \"require('./package.json').name\")"
          PACKAGE_VERSION="$(node -p \"require('./package.json').version\")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with OIDC
        if: steps.npm-version.outputs.already_published != 'true'
        run: npm publish --access public

      - name: Create the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          PACKAGE_VERSION="$(node -p \"require('./package.json').version\")"
          RELEASE_TAG="v${PACKAGE_VERSION}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; preserving the existing immutable release."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" --target "$(git rev-parse HEAD)" \
            --title "${RELEASE_TAG}" --generate-notes
