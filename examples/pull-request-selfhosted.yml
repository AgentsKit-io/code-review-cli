# Runs the review on a self-hosted runner using a logged-in local CLI. This
# example uses Codex; switch provider to claude-cli if that is your local tool.
name: Code Review (local)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: self-hosted
    steps:
      # Service-started runners often have a minimal PATH.
      - name: Add local CLIs to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: AgentsKit-io/code-review-cli@v0.2.3
        with:
          provider: 'codex-cli'
          mode: 'trusted-local'
          # fail-on-block: 'true'   # default: advisory (posts only)
          # block: 'high'
