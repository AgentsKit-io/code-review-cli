# Drop this in any repo at .github/workflows/code-review.yml
# Requires repo/org secret ANTHROPIC_API_KEY.
name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write # post inline + summary review comments

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: AgentsKit-io/code-review-cli@main
        with:
          # default provider is 'anthropic'; switch to any @agentskit adapter:
          # provider: 'openai'   (+ model: 'gpt-4o')   /  'gemini' / 'grok' / 'groq' / 'openrouter' / …
          provider: 'anthropic'
          model: 'claude-opus-4-8'
          api-key: ${{ secrets.LLM_API_KEY }}   # the selected provider's key
          # advisory by default (posts, never blocks). To gate merges:
          # fail-on-block: 'true'
          # block: 'high'        # or 'blocker'
          # max-files: '40'
